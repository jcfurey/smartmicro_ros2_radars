# Bench: UMRR-96 serial 230739 on VN1630A CH1 (SocketCAN can0), 500 kbit/s.
# CAN network ID 0 is inherited from the driver routing template.
# Start radar.launch.py; this profile starts no Ethernet readback process.
/**/smart_radar:
  ros__parameters:
    master_data_serial_type: can_based
    master_inst_serial_type: can_based
    adapters:
      adapter_0:
        hw_type: can
        hw_dev_id: 1
        hw_iface_name: can0
        baudrate: 500000
    sensors:
      sensor_0:
        link_type: can
        pub_type: target
        model: umrr96_can_v1_2_2
        dev_id: 1
        id: 230739
        frame_id: umrr96
        history_size: 10
        inst_type: can_based
        data_type: can_based
        uifname: umrr96_t153_automotive
        uifmajorv: 1
        uifminorv: 2
        uifpatchv: 2
/**/umrr96_views:
  ros__parameters:
    frame_id: umrr96
    grid_frame_id: ''
    tf_wait_seconds: 0.25
    max_range: 20.0
    half_angle_degrees: 90.0
    cell_size: 0.25
    decay_seconds: 2.0
    density_full_scale: 20.0
    publish_hz: 10.0
    image_width: 960
    image_height: 640
    image_angle_bin_degrees: 2.0
    filter_mode: 'off'
    filter_min_snr_db: 6.0
    filter_min_abs_speed: 0.25
