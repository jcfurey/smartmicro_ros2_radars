# Bench configuration: UMRR-96 on cam-ripper. It hard-codes this host's interface
# (enp68s0f0, 192.168.11.17) and the sensor address; copy and edit it for any
# other host and pass it as params_file:=... to umrr96_live.launch.py.
# Add 192.168.11.17/24 to enp68s0f0 before starting.
# See docs/umrr96-bringup.md for setup and hardware verification limits.
# Keys use /** so the same file works when the nodes run in a namespace.
/**/smart_radar:
  ros__parameters:
    master_data_serial_type: port_based
    master_inst_serial_type: port_based
    adapters:
      adapter_0:
        hw_type: eth
        hw_dev_id: 4
        hw_iface_name: enp68s0f0
        hw_ip_address: 192.168.11.17
        port: 55555
    sensors:
      sensor_0:
        link_type: eth
        pub_type: target
        model: umrr96_v1_2_2
        dev_id: 4
        # Wire client ID 0x00038553; matches the label's 8553 suffix.
        id: 230739
        frame_id: umrr96
        history_size: 10
        ip: 192.168.11.11
        port: 55555
        # Keep the data SDK client port-based; readback uses the separate node below.
        inst_type: port_based
        data_type: port_based
        uifname: umrr96_t153_automotive
        uifmajorv: 1
        uifminorv: 2
        uifpatchv: 2

/**/smart_radar_readback:
  ros__parameters:
    sensor_id: 230739
    interface_name: enp68s0f0
    host_ip: 192.168.11.17
    host_port: 55556
    sensor_ip: 192.168.11.11
    sensor_port: 55555
    timeout_ms: 2000
    # Volatile, applied and read back at startup: the sensor restores CAN target
    # output on at every power-up, which drops the Ethernet stream from 18.2 to
    # 8.3 Hz. 0 off (default), 1 on, -1 leave the sensor unchanged.
    startup_can_target_output: 0

/**/umrr96_views:
  ros__parameters:
    frame_id: umrr96
    # Set to odom only when timestamped odom -> umrr96 TF is available.
    # Fan/image and raw/filtered target clouds remain in the sensor frame.
    grid_frame_id: ''
    tf_wait_seconds: 0.25
    max_range: 20.0
    half_angle_degrees: 90.0
    cell_size: 0.25
    decay_seconds: 2.0  # Runtime adjustable exponential time constant, 0.1..30 s.
    density_full_scale: 20.0
    publish_hz: 10.0
    image_width: 960
    image_height: 640
    image_angle_bin_degrees: 2.0
    # Host post-processing only; off preserves the original detections.
    filter_mode: 'off'
    filter_min_snr_db: 6.0
    filter_min_abs_speed: 0.25
