# Example only: merge into your Nav2 costmap parameters; not loaded by this package.
# Radar evidence marks obstacles but never clears: empty cells mean "unknown", and
# sparse radar returns cannot justify free-space ray clearing.
#
# ObstacleLayer keeps a marked cell until some source raytraces it clear, so a
# radar-only ObstacleLayer accumulates a trail behind every moving person.
# Pair radar marking with a lidar (or depth) source that has clearing: true on
# the same layer, or use spatio_temporal_voxel_layer with decay (below).
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "radar_layer", "inflation_layer"]
      radar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: radar_obstacles lidar_clearing
        radar_obstacles:
          # Per-scan evidence from umrr96_processing: persistent static returns,
          # ghost-filtered movers on confirmed tracks, track positions, and
          # anything non-ghost within safety_range. It only marks: clearing needs
          # another source on this layer (lidar raytracing below) or STVL decay.
          topic: /umrr96_processing/obstacles
          data_type: "PointCloud2"
          sensor_frame: ""        # the cloud's frame; umrr96 measures ranges from the radar
          marking: true
          clearing: false
          # Heights are checked in the costmap's global frame. Set the processing
          # parameter obstacle_frame to a frame rigidly attached to the radar (e.g.
          # base_link): z is then obstacle_height (0.3) in that frame, within these
          # limits. With obstacle_frame empty, z is flattened in the radar frame,
          # which assumes a level mount: a radar 0.5 m up pitched 5 deg down puts
          # returns beyond ~8 m below min_obstacle_height and they are dropped.
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          obstacle_max_range: 20.0
          observation_persistence: 0.0  # persistence is applied upstream
          # obstacles are published only for accepted scans. At 8.33 Hz one rejected
          # or dropped scan leaves a 240 ms gap: 0.2 s would mark the costmap not
          # current, and the Jazzy controller aborts after costmap_update_timeout.
          expected_update_rate: 0.5
        lidar_clearing:
          # Clears radar ghosts that land in space the lidar sees as free.
          topic: /lidar/points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          raytrace_max_range: 20.0

      # Radar-only alternative with time decay instead of lidar clearing:
      # stvl_radar_layer:
      #   plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      #   observation_sources: radar_obstacles
      #   voxel_decay: 1.5          # s; a walking person's trail fades
      #   decay_model: 0            # linear
      #   radar_obstacles:
      #     data_type: PointCloud2
      #     topic: /umrr96_processing/obstacles
      #     marking: true
      #     clearing: false
      #     min_obstacle_height: 0.10
      #     max_obstacle_height: 2.0

      # Previous option, kept for reference: pose-compensated accumulator cells.
      # radar_confirmed:

      # Pose-compensated, confirmed cells (>= min_support_scans scans).
      #   topic: /umrr96_accumulation/confirmed_targets
      #   data_type: "PointCloud2"
      # The cloud is in odom; without sensor_frame Nav2 would raytrace from
      # the odom origin. The stamp is the newest contributing scan, so the
      # sensor pose is available in TF when the observation is buffered.
      #   sensor_frame: umrr96
      #   marking: true
      #   clearing: false
      # Heights are in the costmap's global frame. Keep ground and overhead
      # multipath out of the 2D costmap.
      #   min_obstacle_height: 0.10
      #   max_obstacle_height: 2.0
      #   obstacle_max_range: 20.0
      # The accumulator already bounds history (window_seconds); do not
      # stack a second persistence window on top of it.
      #   observation_persistence: 0.0
      #   expected_update_rate: 0.0

      # Alternative: skip the accumulator and let the costmap persist the
      # per-scan Doppler inliers in the sensor frame. Prefer this when TF is
      # the only pose source Nav2 should trust, or to avoid a second evidence
      # window: the costmap transforms each scan at its own stamp.
      # radar_inliers:
      #   topic: /umrr96_processing/doppler_inliers
      #   data_type: "PointCloud2"
      #   sensor_frame: ""        # the cloud's own frame (umrr96)
      #   marking: true
      #   clearing: false
      #   min_obstacle_height: 0.10
      #   max_obstacle_height: 2.0
      #   obstacle_max_range: 20.0
      #   observation_persistence: 0.5   # match the accumulator's window
