/umrr96_processing:
  ros__parameters:
    # Experimental defaults; calibrate against independent controlled motion.
    doppler_sign: 1  # +1 assumes positive receding; -1 means positive approaching.
    min_range: 0.15
    max_range: 120.0
    min_snr_db: 6.0
    residual_threshold: 0.20
    min_inliers: 8
    min_inlier_fraction: 0.60
    max_condition: 30.0
    ransac_trials: 128
    noise_floor: 0.05
    velocity_std_floor: 0.10
    max_velocity_std: 1.0
    max_speed: 15.0
    max_input_age: 0.5
    future_tolerance: 0.05
    stale_timeout: 0.5
