# Matches a node named umrr96_processing in any namespace (see the namespace
# launch argument). Integer values are accepted for floating-point settings.
/**/umrr96_processing:
  ros__parameters:
    # Experimental defaults; calibrate against independent controlled motion.
    doppler_sign: 1  # +1 assumes positive receding; -1 means positive approaching.
    min_range: 0.15
    max_range: 120.0
    min_snr_db: 6.0
    # Tightened from 0.20/0.05/0.10 on 2026-09-24 static + walk captures (stationary
    # sensor): 0.20 absorbed 17% of a walking person's detections into the static fit.
    residual_threshold: 0.05
    min_inliers: 8
    min_inlier_fraction: 0.60
    max_condition: 30.0
    ransac_trials: 128
    noise_floor: 0.02
    velocity_std_floor: 0.05  # Static noise was ~3 mm/s; kept conservative until moving-sensor data.
    max_velocity_std: 1.0
    max_speed: 15.0
    # Multipath-ghost rejection for moving_targets (85% ghosts removed, 97% real kept).
    range_gap: 1.5
    speed_tolerance: 0.25
    wall_azimuth_deg: 4.0
    # Moving-object tracker (walk-through: person tracked in 96% of walking scans,
    # ghost tracks in 0.7% of labelled scans). The background model assumes the
    # radar is fixed in the scene: it restarts (and the obstacle shadow rule is off)
    # while the fitted sensor speed exceeds sensor_moving_speed for 3 scans.
    cluster_radius: 0.6
    gate: 1.2
    confirm_hits: 8
    confirm_window: 10
    max_coast: 1.0
    static_hold: 5.0
    background_time_constant: 30.0
    # 0.3 rather than 0.5: walls a person occludes stay background, so fewer are dropped
    # as that person's multipath (walk: structure beyond a track 72% -> 81% kept, far
    # ghost points 0.07 -> 0.14 per scan).
    background_threshold: 0.3
    background_warmup: 3.0
    sensor_moving_speed: 0.05  # static captures: fitted speed <= 0.011 m/s
    # Nav2 obstacle evidence (~/obstacles, marking only). Static capture: 78% of
    # flicker removed, 97% of structure kept; walk: stationary ghosts beyond the
    # person cut 99% while walking, 84% while standing.
    persistence_hits: 3
    persistence_window: 5
    safety_range: 1.0
    track_radius: 0.8
    obstacle_height: 0.3  # sensor frame; set so mount height + this is within the layer limits
    shadow_gap: 1.5
    max_input_age: 0.5
    future_tolerance: 0.05
    stale_timeout: 0.5
    diagnostics_period: 1.0  # Unchanged /diagnostics at most this often; changes publish at once.
