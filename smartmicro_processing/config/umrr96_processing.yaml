# Matches a node named umrr96_processing in any namespace (see the namespace
# launch argument). Integer values are accepted for floating-point settings.
/**/umrr96_processing:
  ros__parameters:
    # Experimental defaults; calibrate against independent controlled motion.
    doppler_sign: 1  # +1 assumes positive receding; -1 means positive approaching.
    min_range: 0.15
    max_range: 120.0
    min_snr_db: 6.0
    # Tightened from 0.20/0.05/0.10 on 2026-09-24 static + walk captures (stationary
    # sensor): 0.20 absorbed 17% of a walking person's detections into the static fit.
    residual_threshold: 0.05
    min_inliers: 8
    min_inlier_fraction: 0.60
    max_condition: 30.0
    ransac_trials: 128
    noise_floor: 0.02
    velocity_std_floor: 0.05  # Static noise was ~3 mm/s; kept conservative until moving-sensor data.
    max_velocity_std: 1.0
    max_speed: 15.0
    # Multipath-ghost rejection for moving_targets (85% ghosts removed, 97% real kept).
    range_gap: 1.5
    speed_tolerance: 0.25
    wall_azimuth_deg: 4.0
    max_input_age: 0.5
    future_tolerance: 0.05
    stale_timeout: 0.5
    diagnostics_period: 1.0  # Unchanged /diagnostics at most this often; changes publish at once.
